name: keep-alive

# Render's free tier spins the service down after 15 minutes without a request,
# and the next visitor waits 30-60 seconds for a cold start. This job requests
# /health every ten minutes so the API is warm for anyone arriving from the
# README or a resume link. It fails if the service does not answer 200 within
# a couple of minutes, which makes it a basic uptime check as well.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request /health until it answers 200
        run: |
          url="https://churn-prediction-8qvu.onrender.com/health"
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$url" || echo "000")
            if [ "$code" = "200" ]; then
              echo "attempt $attempt: 200 OK"
              exit 0
            fi
            echo "attempt $attempt: got $code, retrying in 20s"
            sleep 20
          done
          echo "service did not answer 200 after six attempts"
          exit 1
